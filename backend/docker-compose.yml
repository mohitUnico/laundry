version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: laundry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laundry_user
      POSTGRES_PASSWORD: laundry_pass
      POSTGRES_DB: laundry_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U laundry_user -d laundry_db' ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laundry-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://laundry_user:laundry_pass@postgres:5432/laundry_db?schema=public
    ports:
      - '5000:5000'
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  laundry-network:
    driver: bridge
