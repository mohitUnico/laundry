# Uses Supabase as database (DATABASE_URL from backend/.env)
# Optional: run with --profile local-db to use local Postgres instead
services:
  postgres:
    image: postgres:14-alpine
    container_name: laundry-db
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "laundry_user"
      POSTGRES_PASSWORD: "laundry_pass"
      POSTGRES_DB: "laundry_db"
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U laundry_user -d laundry_db' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: laundry-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundry-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # development: verbose logs, dev CORS behavior (see app.js)
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      PICKUP_ASSIGNMENT_USE_QUEUE: "true"
      REDIS_URL: redis://redis:6379
    ports:
      # Host 3001 → container 3000 (use 3001 if host 3000 is already taken by local npm run dev)
      - '3001:3000'
    volumes:
      # Mount host .env so /app/.env exists for dotenv (env_file alone can mis-parse or set empty DATABASE_URL on Windows)
      - ./backend/.env:/app/.env:ro
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:3000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # Frontend service (ready for future implementation)
  # frontend:
  #   build:
  #     context: ./mart-admin
  #     dockerfile: Dockerfile
  #   container_name: laundry-frontend
  #   restart: unless-stopped
  #   ports:
  #     - '3000:80'
  #   depends_on:
  #     - backend
  #   networks:
  #     - laundry-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  laundry-network:
    driver: bridge
