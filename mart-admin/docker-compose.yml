version: '3.8'

services:
  mart-admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:5000/api/v1
    depends_on:
      - backend
    networks:
      - laundry-network

networks:
  laundry-network:
    external: true
