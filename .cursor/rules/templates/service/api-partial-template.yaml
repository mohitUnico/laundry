AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: {{serviceName | lower}} Service - API layer

Parameters:
  Environment:
    Type: String
  HasCognitoArn:
    Type: String
    AllowedValues: [true, false]
  CognitoUserPoolArn:
    Type: String
    Default: ""

Conditions:
  HasCognitoArnCond: !Equals [!Ref HasCognitoArn, "true"]

Resources:
  {{serviceName}}ServiceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub {{serviceName}}-service-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !If
              - HasCognitoArnCond
              - !Ref CognitoUserPoolArn
              - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/{{resolve:ssm:/${Environment}/{{serviceName}}-service/cognito/user-pool-id}}'
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: !Sub "'https://${Environment}.DoorSync.com'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
{{perRouteThrottles}}
      Models:
        GenericJsonBody:
          type: object
          additionalProperties: true

  {{CamelServiceName}}DefaultApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub {{serviceName}}-default-api-key-${Environment}
      Enabled: true

  {{CamelServiceName}}DefaultUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub {{serviceName}}-default-usage-plan-${Environment}
      Throttle:
        BurstLimit: 100
        RateLimit: 50
      ApiStages:
        - ApiId: !Ref {{serviceName}}ServiceApi
          Stage: !Ref Environment

  {{CamelServiceName}}DefaultUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    DependsOn:
      - {{CamelServiceName}}DefaultUsagePlan
      - {{CamelServiceName}}DefaultApiKey
    Properties:
      KeyId: !Ref {{CamelServiceName}}DefaultApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref {{CamelServiceName}}DefaultUsagePlan

  {{CamelServiceName}}ApiGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub {{serviceName}}-api-5xx-${Environment}
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub {{serviceName}}-service-${Environment}
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  {{CamelServiceName}}ApiGatewayLatencyP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub {{serviceName}}-api-latency-p95-${Environment}
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub {{serviceName}}-service-${Environment}
        - Name: Stage
          Value: !Ref Environment
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  {{CamelServiceName}}ApiGatewayThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub {{serviceName}}-api-throttles-${Environment}
      Namespace: AWS/ApiGateway
      MetricName: ThrottledRequests
      Dimensions:
        - Name: ApiName
          Value: !Sub {{serviceName}}-service-${Environment}
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  RestApiId:
    Value: !Ref {{serviceName}}ServiceApi
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${{{serviceName}}ServiceApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"


