name: laundry_customer_app
description: Laundry App Customer Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP Client
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Image Handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  
  # Forms & Validation
  # Note: Add form_builder packages when needed
  # flutter_form_builder: ^9.1.1
  # form_builder_validators: ^9.1.0
  
  # Date & Time
  # intl is managed by Flutter SDK
  
  # Push Notifications
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  
  # Utils
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  flutter_local_notifications: ^17.2.2
  country_picker: ^2.0.27

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/cart/
    - assets/images/home/
    - assets/images/home_linen/
    - assets/images/luxury_care/
    - assets/images/pro_clean/
    - assets/images/regular_wash/
    - assets/images/shoe_cleaning/
    - assets/images/stain_treatment/
    - assets/images/winter_wear/
    - assets/icons/
    - assets/icons/order_track/
    - assets/icons/bottom_navbar/
    
  # Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700

