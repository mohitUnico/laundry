services:
  postgres:
    image: postgres:14-alpine
    container_name: laundry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "laundry_user"
      POSTGRES_PASSWORD: "laundry_pass"
      POSTGRES_DB: "laundry_db"
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U laundry_user -d laundry_db' ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundry-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://laundry_user:laundry_pass@postgres:5432/laundry_db?schema=public
    ports:
      - '3000:3000'
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:3000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # Frontend service (ready for future implementation)
  # frontend:
  #   build:
  #     context: ./mart-admin
  #     dockerfile: Dockerfile
  #   container_name: laundry-frontend
  #   restart: unless-stopped
  #   ports:
  #     - '3000:80'
  #   depends_on:
  #     - backend
  #   networks:
  #     - laundry-network

volumes:
  postgres_data:
    driver: local

networks:
  laundry-network:
    driver: bridge
