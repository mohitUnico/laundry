# Local development: PostgreSQL + Redis + Backend API + pgAdmin
# Start: docker compose up -d
# API on host: http://localhost:3001  (or http://<LAN_IP>:3001 for mobile on Wi-Fi)
# pgAdmin: http://localhost:5050  (login below; register server Host=postgres)
services:
  postgres:
    image: postgres:14-alpine
    container_name: laundry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "laundry_user"
      POSTGRES_PASSWORD: "laundry_pass"
      POSTGRES_DB: "laundry_db"
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U laundry_user -d laundry_db' ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laundry-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laundry-network

  redis:
    image: redis:7-alpine
    container_name: laundry-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundry-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      PICKUP_ASSIGNMENT_USE_QUEUE: "true"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://laundry_user:laundry_pass@postgres:5432/laundry_db?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://laundry_user:laundry_pass@postgres:5432/laundry_db
    ports:
      - '3001:3000'
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laundry-network
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:3000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  laundry-network:
    driver: bridge
